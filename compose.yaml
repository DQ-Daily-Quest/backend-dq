# 로컬 개발용 PostgreSQL
# 실행: docker compose up -d
# 종료: docker compose down   (데이터 삭제까지: docker compose down -v)
services:
  postgres:
    image: postgres:16-alpine
    container_name: dq-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: dq
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
    volumes:
      - dq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dq-pgdata:
