spring:
  application:
    name: backend-dq
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dq}
    username: ${DB_USERNAME:dq}
    password: ${DB_PASSWORD:dq}
  jpa:
    open-in-view: false
    # 스키마는 Flyway(src/main/resources/db/migration)가 관리하고 Hibernate는 엔티티와 일치하는지 검증만 한다.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${SERVER_PORT:8080}

dq:
  jwt:
    secret: ${JWT_SECRET:dq-local-dev-secret-key-change-me-at-least-32-bytes}
    access-token-expiry-seconds: 1800       # 30분
    refresh-token-expiry-seconds: 604800    # 7일
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/files}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.dq.backend: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
