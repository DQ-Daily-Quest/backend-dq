spring:
  datasource:
    url: jdbc:h2:mem:dq;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # 테스트는 H2 인메모리 + Hibernate 자동 생성 (Flyway SQL은 PostgreSQL 전용)
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

dq:
  jwt:
    secret: test-secret-key-for-unit-tests-at-least-32-bytes-long
    access-token-expiry-seconds: 1800
    refresh-token-expiry-seconds: 604800
  upload:
    dir: ./build/test-uploads
    base-url: http://localhost:8080/files
