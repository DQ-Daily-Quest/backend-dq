spring:
  datasource:
    url: jdbc:h2:mem:dq;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

dq:
  jwt:
    secret: test-secret-key-for-unit-tests-at-least-32-bytes-long
    access-token-expiry-seconds: 3600
    refresh-token-expiry-seconds: 1209600
  upload:
    dir: ./build/test-uploads
    base-url: http://localhost:8080/files
